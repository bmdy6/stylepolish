[project]
name = "stylepolish-relay"
version = "0.1.0"
description = "Private invite-only, budget-limited text relay for StylePolish"
requires-python = ">=3.11"
dependencies = ["starlette>=0.49.1,<1", "httpx>=0.28.1,<0.29", "uvicorn>=0.38,<1"]

[project.scripts]
stylepolish-relay = "stylepolish_relay.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stylepolish_relay"]
